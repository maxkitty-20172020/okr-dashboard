<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运营部看板 · 页面重做方案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#E9EAEE;font-family:'Noto Sans SC',system-ui,-apple-system,'PingFang SC',sans-serif;color:#16181D}
button{font:inherit}
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:10px 20px;background:#111318;color:#F2F3F5}
.bar strong{font-size:14px}
.bar .grp{display:flex;gap:4px;background:#24272F;padding:3px;border-radius:9px}
.bar button{all:unset;cursor:pointer;height:34px;padding:0 14px;border-radius:7px;font-size:13px;color:#C4C8D0;display:inline-flex;align-items:center}
.bar button.on{background:#F2F3F5;color:#111318;font-weight:600}
.bar .tip{font-size:12px;color:#9AA0AB}
.phone-wrap{display:flex;justify-content:center;padding:32px 16px 64px}
.phone{width:390px;height:844px;border-radius:36px;overflow:hidden;box-shadow:0 0 0 10px #111318,0 24px 60px rgba(0,0,0,.25);position:relative}
.desc{max-width:1100px;margin:0 auto;padding:16px 20px 0;font-size:13px;color:#4A5160}

/* ===== A 清单式 ===== */
.A{min-height:calc(100vh - 54px);background:#F6F7F9;color:#16181D;font-size:14px;line-height:1.55}
.A .layout{display:flex;flex-wrap:wrap;align-items:stretch;min-height:calc(100vh - 54px)}
.A nav.side{flex:1 1 200px;max-width:232px;padding:20px 14px;border-right:1px solid #E3E6EB;background:#FBFBFC;display:flex;flex-direction:column;gap:4px}
.A .navlink{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:8px;color:#454C59;text-decoration:none;font-size:14px}
.A .navlink:hover{background:#ECEEF2;color:#16181D}
.A .nav-on{background:#E3E9FB;color:#1E3FB0;font-weight:500}
.A main{flex:999 1 560px;min-width:0;padding:28px 40px 48px;display:flex;flex-direction:column;gap:24px}
.A .panel{background:#fff;border:1px solid #E3E6EB;border-radius:12px;overflow:hidden}
.A .stat{background:#fff;border:1px solid #E3E6EB;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.A .stat span{font-size:12px;color:#5B6270}.A .stat strong{font-size:24px}
.A .badge{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap}
.A .tone-ok{background:#E6F4EC;color:#1B6340}.A .tone-risk{background:#FDECEC;color:#A8201A}.A .tone-wait{background:#EFEBFA;color:#5235A6}.A .tone-plain{background:#EDEFF2;color:#454C59}
.A .fu{font-family:'JetBrains Mono',monospace;font-size:12px;white-space:nowrap;padding:2px 6px;border-radius:4px}
.A .fu-today{background:#FFF1D6;color:#8A4B00}.A .fu-late{background:#FDECEC;color:#A8201A}.A .fu-plain{color:#5B6270}
.A .row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;width:100%;padding:14px 16px;border-top:1px solid #E6E8EC;cursor:pointer}
.A .row:hover{background:#F8F9FB}.A .row-on{background:#EEF3FF}.A .row:focus-visible{outline:2px solid #2F5BEA;outline-offset:-2px}
.A .seg{all:unset;height:36px;padding:0 14px;border-radius:7px;font-size:13px;color:#454C59;cursor:pointer}
.A .seg-on{background:#fff;color:#16181D;font-weight:500;box-shadow:0 1px 2px rgba(16,24,40,.12)}
.A .btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.A .btn-primary{background:#2F5BEA;color:#fff}.A .btn-primary:hover{background:#244BD0}
.A .btn-ghost{background:#fff;color:#16181D;border:1px solid #D7DBE2}.A .btn-ghost:hover{background:#F3F4F7}
.A .btn-sm{height:32px;padding:0 10px;font-size:13px}
.A aside{flex:1 1 340px;max-width:420px;background:#fff;border-left:1px solid #E3E6EB;padding:24px;display:flex;flex-direction:column;gap:18px}
.A .lbl{font-size:12px;color:#5B6270}
.A .mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:#5B6270}

/* ===== B 卡片式 ===== */
.B{position:relative;min-height:calc(100vh - 54px);background:#F3F1EC;color:#1E1B16;font-size:14px;line-height:1.6}
.B .serif{font-family:'Noto Serif SC',serif}
.B header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 32px;border-bottom:1px solid #E4DFD5;background:#FBFAF7}
.B .toplink{display:flex;align-items:center;height:40px;padding:0 14px;border-radius:999px;color:#5E574C;text-decoration:none;font-size:14px}
.B .toplink:hover{background:#E8E4DB;color:#1E1B16}.B .top-on,.B .top-on:hover{background:#1E1B16;color:#FBFAF7}
.B main{max-width:1280px;margin:0 auto;padding:32px 32px 56px;display:flex;flex-direction:column;gap:28px}
.B .seg{all:unset;height:36px;padding:0 14px;border-radius:999px;font-size:13px;color:#5E574C;cursor:pointer}
.B .seg-on{background:#fff;color:#1E1B16;font-weight:500;box-shadow:0 1px 2px rgba(30,27,22,.14)}
.B .card{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;width:100%;padding:16px;background:#fff;border:1px solid #E4DFD5;border-radius:14px;cursor:pointer}
.B .card:hover{border-color:#C9C1B2;box-shadow:0 4px 14px rgba(30,27,22,.07)}.B .card-on{border-color:#2E6B4F;box-shadow:0 0 0 1px #2E6B4F}
.B .chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.B .tone-ok{background:#E3F0E8;color:#1F5A3F}.B .tone-risk{background:#FBE6DC;color:#9A3412}.B .tone-wait{background:#ECE8F7;color:#4C3A91}.B .tone-plain{background:#EFECE6;color:#4F493F}
.B .fu-today{background:#FCEFD2;color:#7A4A00}.B .fu-late{background:#FBE6DC;color:#9A3412}.B .fu-plain{background:#F3F1EC;color:#5E574C}
.B .btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.B .btn-primary{background:#2E6B4F;color:#fff}.B .btn-primary:hover{background:#255940}
.B .btn-ghost{background:#fff;color:#1E1B16;border:1px solid #D6D0C4}.B .btn-sm{height:34px;padding:0 12px;font-size:13px}
.B .muted{color:#5E574C}
.B aside{position:absolute;top:0;right:0;width:440px;max-width:100%;min-height:100%;background:#FBFAF7;border-left:1px solid #E4DFD5;box-shadow:-18px 0 40px rgba(30,27,22,.10);padding:28px;display:flex;flex-direction:column;gap:18px}

/* ===== C 简报式 ===== */
.C{min-height:calc(100vh - 54px);background:#fff;color:#0F172A;font-size:15px;line-height:1.6}
.C .num{font-family:'Space Grotesk',sans-serif}
.C header.top{border-bottom:1px solid #E5E8EC}
.C .wrap{max-width:1120px;margin:0 auto;padding:0 32px}
.C .tab{display:flex;align-items:center;height:44px;color:#556070;text-decoration:none;font-size:14px;border-bottom:2px solid transparent}
.C .tab:hover{color:#0F172A}.C .tab-on{color:#0F172A;font-weight:700;border-bottom-color:#0F172A}
.C .seg{all:unset;height:36px;padding:0 14px;font-size:13px;color:#556070;cursor:pointer;border:1px solid #D5DAE1}
.C .seg:first-child{border-radius:8px 0 0 8px}.C .seg:last-child{border-radius:0 8px 8px 0;border-left:none}
.C .seg-on{background:#0F172A;color:#fff;border-color:#0F172A}
.C .item{all:unset;box-sizing:border-box;display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:20px;align-items:baseline;width:100%;padding:18px 0;border-top:1px solid #E5E8EC;cursor:pointer}
.C .item:hover .ttl{text-decoration:underline;text-underline-offset:3px}.C .item:focus-visible{outline:2px solid #0F766E;outline-offset:2px}
.C .when{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px}
.C .fu-today{color:#B45309}.C .fu-late{color:#B91C1C}.C .fu-plain{color:#556070}
.C .st{font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;white-space:nowrap}
.C .tone-ok{background:#E6F3F1;color:#0B5A54}.C .tone-risk{background:#FDE8E8;color:#991B1B}.C .tone-wait{background:#EEF0F6;color:#3B4A6B}.C .tone-plain{background:#F1F3F5;color:#3D4654}
.C .btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.C .btn-primary{background:#0F766E;color:#fff}.C .btn-primary:hover{background:#0B5A54}
.C .btn-ghost{background:#fff;color:#0F172A;border:1px solid #D5DAE1}.C .btn-sm{height:32px;padding:0 10px;font-size:13px}
.C .muted{color:#556070}
.C .detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 32px;padding:4px 0 22px 140px}

/* ===== F 新填写方式（B 风格） ===== */
.F{min-height:calc(100vh - 54px);background:#F3F1EC;color:#1E1B16;font-size:14px;line-height:1.6;padding:28px 20px 64px}
.F .serif{font-family:'Noto Serif SC',serif}
.F .cols{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px;align-items:start}
.F .sheet{background:#FBFAF7;border:1px solid #E4DFD5;border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:18px}
.F .q{display:flex;flex-direction:column;gap:8px}
.F .q>span{font-weight:700;font-size:15px}
.F .q small{font-size:12px;color:#5E574C;font-weight:400}
.F input,.F textarea,.F select{font:inherit;width:100%;box-sizing:border-box;border:1px solid #D6D0C4;border-radius:12px;padding:11px 14px;background:#fff;color:#1E1B16;min-height:44px}
.F textarea{resize:vertical}
.F input:focus,.F textarea:focus,.F select:focus{outline:2px solid #2E6B4F;outline-offset:1px;border-color:#2E6B4F}
.F .chips{display:flex;flex-wrap:wrap;gap:8px}
.F .chip{all:unset;box-sizing:border-box;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #D6D0C4;background:#fff;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.F .chip:hover{border-color:#9C9385}
.F .chip.on{background:#1E1B16;border-color:#1E1B16;color:#FBFAF7}
.F .chip.risk.on{background:#9A3412;border-color:#9A3412}
.F .chip.done.on{background:#2E6B4F;border-color:#2E6B4F}
.F .more{all:unset;cursor:pointer;color:#2E6B4F;font-weight:500;font-size:14px;min-height:40px;display:inline-flex;align-items:center}
.F .btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 22px;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer;background:#2E6B4F;color:#fff}
.F .btn:hover{background:#255940}
.F .note{font-size:13px;color:#5E574C;background:#EFECE6;border-radius:12px;padding:10px 12px}
.F .warn{background:#FBE6DC;color:#7C2D12}
.F .ok{background:#E3F0E8;color:#1F5A3F}
.F table{width:100%;border-collapse:collapse;font-size:13px}
.F td,.F th{border-top:1px solid #E4DFD5;padding:8px 6px;text-align:left;vertical-align:top}
.F th{color:#5E574C;font-weight:500}
@media (max-width:720px){.C .item{grid-template-columns:72px minmax(0,1fr)}.C .item .st{grid-column:2}.C .detail{padding-left:0}.A main,.B main{padding:20px 16px 40px}.B header.top{padding:12px 16px}.C .wrap{padding:0 16px}}
</style>
</head>
<body>
<div class="bar">
  <strong>运营部看板 · 页面重做方案</strong>
  <div class="grp" role="group" aria-label="选择方案">
    <button data-act="dir" data-v="A">A 清单式</button>
    <button data-act="dir" data-v="B">B 卡片式</button>
    <button data-act="dir" data-v="C">C 简报式</button>
    <button data-act="dir" data-v="F">新填写方式</button>
  </div>
  <div class="grp" role="group" aria-label="选择设备">
    <button data-act="device" data-v="desktop">电脑</button>
    <button data-act="device" data-v="phone">手机</button>
  </div>
  <span class="tip">电脑版可点击：切换成员 / 老板视角、点开事项、点「暂无变化」。人名与事项为演示数据。</span>
</div>
<div id="stage"></div>

<script>
const ICON = {
  plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  close: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  home: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  list: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  cal: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
  goal: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>',
  people: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>',
  me: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>'
};
const big = s => s.replace('width="16" height="16"', 'width="22" height="22"');

const TASKS = [
  { id: 't1', title: '验证核心产品主图方案', area: '业务', owner: '李明', status: '进行中', tone: 'ok', due: '10/24', follow: '今天', fu: 'today', scope: '美国站 · 厨房线', criteria: '取得测试结果，确定采用哪版主图并记录依据。', latest: '两版主图已上线，等待第一周点击数据。', next: '周五收集点击率与转化数据', risk: '', collab: [{ name: '王芳', what: '整理竞品主图对比', state: '推进中' }], log: [{ when: '10/14 16:20', who: '李明', what: '更新进展：两版主图已上线' }, { when: '10/10 11:05', who: '李明', what: '安排王芳协作' }, { when: '10/09 09:30', who: '李明', what: '创建事项' }], mine: true, helping: false },
  { id: 't2', title: '确认旺季备货与出货排期', area: '库存', owner: '赵强', status: '受阻', tone: 'risk', due: '10/20', follow: '晚了 1 天', fu: 'late', scope: '英国站 · 收纳线', criteria: '确认销量预测、补货数量和供应商出货排期，并同步给协作人。', latest: '主供应商排期未回复，海运舱位紧张。', next: '周一前拿到备选供应商报价', risk: '需要协调备选供应商，否则 11 月中旬可能断货。', collab: [{ name: '李明', what: '提供 11–12 月销量预测', state: '待交付' }], log: [{ when: '10/15 18:02', who: '赵强', what: '标记受阻：主供应商未回复' }, { when: '10/12 10:40', who: '赵强', what: '安排李明协作' }], mine: false, helping: true, helpWhat: '提供 11–12 月销量预测' },
  { id: 't3', title: '新人独立接手产品线', area: '团队', owner: '王芳', status: '进行中', tone: 'ok', due: '未定', follow: '10/21', fu: 'plain', scope: '欧洲站', criteria: '通过独立操作验收，并完成任务交接。', latest: '跟岗两周结束，开始独立回复客户消息。', next: '下周二做第一次独立操作验收', risk: '', collab: [], log: [{ when: '10/15 09:12', who: '王芳', what: '更新进展：跟岗结束' }], mine: false, helping: false },
  { id: 't4', title: '整理第四季度广告预算', area: '业务', owner: '李明', status: '未开始', tone: 'plain', due: '未定', follow: '10/22', fu: 'plain', scope: '全站点', criteria: '列出各站点预算上限与分配依据，老板确认。', latest: '刚创建，还没有进展。', next: '先拉第三季度花费明细', risk: '', collab: [], log: [{ when: '10/16 09:01', who: '李明', what: '创建事项' }], mine: true, helping: false },
  { id: 't5', title: '下架滞销 SKU 清单', area: '库存', owner: '李明', status: '等待中', tone: 'wait', due: '10/31', follow: '今天', fu: 'today', scope: '美国站', criteria: '确定下架名单并完成清货方案。', latest: '清单初稿已发给赵强核对库存数。', next: '等赵强回复后定稿', risk: '', collab: [{ name: '赵强', what: '核对剩余库存数', state: '已交付' }], log: [{ when: '10/13 15:30', who: '赵强', what: '交付：库存数已核对' }, { when: '10/11 14:00', who: '李明', what: '安排赵强协作' }], mine: true, helping: false }
];

const state = { form: { follow: '3d', more: false, mood: 'ok', area: 'biz', prio: 'n', saved: '' }, dir: 'A', device: 'desktop', view: 'member', open: 't1', reported: { t1: true, t3: true } };

function model() {
  const boss = state.view === 'boss';
  const all = TASKS;
  const late = t => t.fu === 'today' || t.fu === 'late';
  const sec = (title, hint, items, line) => ({ title, hint, items: items.map(t => ({ t, line: line ? line(t) : t.latest })) });
  let sections, scope, stats, headline, lede;
  if (boss) {
    const attention = all.filter(t => t.tone === 'risk');
    const today = all.filter(late);
    sections = [
      sec('需要你出面', '受阻或有风险，主责写了需要的支持', attention, t => t.risk),
      sec('今天该有回音', '按跟进日期，晚了的排前面', today),
      sec('还没定期限', '照常推进，必要时请主责补期限', all.filter(t => t.due === '未定'))
    ];
    scope = all;
    stats = [['在推进的事', all.length, '#0F172A'], ['受阻 / 有风险', attention.length, '#B91C1C'], ['今天该有回音', today.length, '#B45309'], ['本周进展已写', all.filter(t => state.reported[t.id]).length + ' / ' + all.length, '#0F766E']];
    headline = '5 件事在推进，1 件卡住了，需要你出面。';
    lede = '赵强的旺季备货在等供应商回复，已晚 1 天；他需要你协调备选供应商。其余事项按计划推进。';
  } else {
    const mine = all.filter(t => t.mine);
    const today = mine.filter(late);
    const helping = all.filter(t => t.helping);
    sections = [
      sec('今天要跟进', '我主责 · 跟进日是今天或已过', today, t => '下一步：' + t.next),
      sec('等我交付', '别人安排给我的协作', helping, t => '我要交：' + t.helpWhat),
      sec('我负责 · 还没定期限', '照常推进，也会出现在本周进展里', mine.filter(t => t.due === '未定'))
    ];
    scope = mine;
    stats = [['我负责的事', mine.length, '#0F172A'], ['今天要跟进', today.length, '#B45309'], ['等我交付', helping.length, '#B91C1C'], ['本周进展已写', mine.filter(t => state.reported[t.id]).length + ' / ' + mine.length, '#0F766E']];
    headline = '今天有 2 件事要跟进，赵强在等你的销量预测。';
    lede = '他的旺季备货已经受阻，你的预测是他重新排期的依据，建议先交。';
  }
  const pending = scope.filter(t => !state.reported[t.id]);
  const people = ['李明', '王芳', '赵强'].map(name => {
    const own = all.filter(t => t.owner === name);
    const risky = own.some(t => t.tone === 'risk');
    return { name, own: own.length, help: all.filter(t => t.collab.some(c => c.name === name)).length, risky };
  });
  return { boss, sections, scope, stats, pending, done: scope.length - pending.length, total: scope.length, people, headline, lede, open: all.find(t => t.id === state.open) };
}

function render() {

  if (state.dir === 'F') {
    stage.innerHTML = state.device === 'phone' ? `<p class="desc">${DESC.F}</p><div class="phone-wrap"><div class="phone" style="overflow:auto">${renderF()}</div></div>` : renderF();

  }

  const a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === 'dir') { state.dir = v; state.open = v === 'B' ? null : 't1'; }
  else if (act === 'device') state.device = v;
  else if (act === 'view') { state.view = v; state.open = null; }
  else if (act === 'open') state.open = v;
  else if (act === 'toggle') state.open = state.open === v ? null : v;
  else if (act === 'close') state.open = null;
  else if (act === 'quick') state.reported[v] = true;
  else if (act === 'form') { state.form[el.dataset.g] = v; state.form.saved = ''; }
  else if (act === 'form-more') state.form.more = !state.form.more;
  else if (act === 'form-save') { state.form.saved = v; setTimeout(() => { state.form.saved = ''; render(); }, 2600); }
  render();
});
render();
</script>
